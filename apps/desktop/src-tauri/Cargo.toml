[package]
name = "candorlens-desktop"
version = "0.0.0"
description = "CandorLens desktop application"
authors = ["CandorLens"]
edition = "2024"

[lib]
name = "candorlens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.4", features = [] }
