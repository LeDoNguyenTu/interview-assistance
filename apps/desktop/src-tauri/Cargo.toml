[package]
name = "candorlens-desktop"
version = "0.0.0"
description = "CandorLens desktop application"
authors = ["CandorLens"]
edition = "2024"

[lib]
name = "candorlens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
aes-gcm = "=0.10.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.4", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
tauri-plugin-stronghold = "=2.3.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "=0.18.1"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }
windows-core = "=0.61.2"
