name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - packages/**
      - .github/workflows/desktop.yml
      - package.json
      - pnpm-lock.yaml
  push:
    branches:
      - main
      - feature/**
      - fix/**
    paths:
      - apps/desktop/**
      - packages/**
      - .github/workflows/desktop.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  desktop:
    name: Windows desktop gates
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run desktop webview tests
        run: pnpm --filter @candorlens/desktop test

      - name: Build debug desktop application
        run: pnpm --filter @candorlens/desktop tauri build --debug
