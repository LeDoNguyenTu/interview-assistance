name: Database

on:
  pull_request:
    paths:
      - supabase/**
      - .github/workflows/database.yml
      - package.json
      - pnpm-lock.yaml
  push:
    branches:
      - main
      - feature/**
      - fix/**
    paths:
      - supabase/**
      - .github/workflows/database.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  database:
    name: Local Supabase gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Reset local database
        run: pnpm exec supabase db reset

      - name: Run database tests
        run: pnpm exec supabase test db

      - name: Lint database schema
        run: pnpm exec supabase db lint --level warning
